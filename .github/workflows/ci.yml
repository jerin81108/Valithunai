name: Vazhithunai CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  offline-and-safety-check:
    name: Safety Engine Verification & Network Ban Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Ban Network CI Check (100% Offline Enforced)
        run: node scripts/ban-network-test.mjs

      - name: Run Safety Engine Test Suite (< 1 second budget)
        run: pnpm --filter @vazhithunai/safety-engine test:perf

